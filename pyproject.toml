[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dailies"
version = "0.1.0"
description = "Triage for AI-generated video takes: kill the dead, rank the survivors"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Liz Zhang", email = "hello.liz.zhang@gmail.com" }]
requires-python = ">=3.9"
keywords = ["video", "ai", "comfyui", "qc", "triage", "vlm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
yaml = ["pyyaml"]
blake3 = ["blake3"]

[project.scripts]
dailies = "dailies.cli:main"

[project.urls]
Homepage = "https://github.com/zhang-liz/dailies"
Issues = "https://github.com/zhang-liz/dailies/issues"

[tool.setuptools.packages.find]
include = ["dailies*"]

[tool.setuptools.package-data]
dailies = ["schemas/*.schema.json"]
